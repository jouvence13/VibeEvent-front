# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name eventchill.fun www.eventchill.fun localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Rediriger tout le trafic HTTP vers HTTPS (sauf pour acme-challenge)
    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur HTTPS Sécurisé
server {
    listen 443 ssl;
    server_name eventchill.fun www.eventchill.fun;

    # Chemins des certificats SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/eventchill.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventchill.fun/privkey.pem;

    # Protocoles et chiffrements modernes
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
